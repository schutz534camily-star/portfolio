<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio de Design e Vídeo</title>
<meta name="description" content="Portfólio de Camily Schütz: vídeo, social media e design.">
<meta property="og:type" content="website">
<meta property="og:title" content="Camily Schütz — Portfólio de Design e Vídeo">
<meta property="og:description" content="Portfólio de Camily Schütz: vídeo, social media e design.">
<meta property="og:image" content="https://portfolio.schutz534camily.workers.dev/fundo.jpg">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: hero com linha do tempo de edição (vídeo acima, design abaixo) + grade de cards que expandem em tela cheia. */
  --bg:#6F0085;
  --bg-deep:#42004F;
  --bg-lift:#8F1AA8;
  --ink:#FFF3FC;
  --muted:#E8C3F2;
  --accent:#FFC94A;
  --accent-ink:#2B0034;
  --detail:#2B0034;
  --veil:43,0,52;--card-rgb:0,0,0;--line-rgb:255,243,252;
  --foto:linear-gradient(rgba(var(--veil),.80),rgba(var(--veil),.80)),url(fundo.jpg) center 25%/cover no-repeat;
  --line:rgba(var(--line-rgb),.24);
  --f-display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* aparência por elemento (padrão = visual original; o painel Aparência troca estes valores) */
  --ink-live:var(--ink);--muted-live:var(--muted);--accent-live:var(--accent);
  --g1:#A524BF;--g2:#4A0058;--f1:#A524BF;--f2:#4A0058;
  --t-abbtn:var(--ink);--t-abt:var(--ink);--t-abs:var(--ink);--t-abx:var(--muted);
  --ff-abbtn:var(--f-display);--ff-abt:var(--f-display);--ff-abs:var(--f-display);--ff-abx:var(--f-body);
  --t-hero:var(--ink);--t-mov:#A524BF;--t-dot:#FFFFFF;--t-sec:var(--ink);--t-card:var(--ink);--t-kind:var(--muted);--t-lead:var(--muted);--t-ig:var(--accent);--t-chip:var(--ink);--t-sub:var(--ink);--t-blk:var(--ink);--t-cap:var(--ink);--t-nav:var(--muted);--t-foot:var(--ink);
  --ff-hero:var(--f-display);--ff-sec:var(--f-display);--ff-card:var(--f-display);--ff-kind:var(--f-body);--ff-lead:var(--f-body);--ff-ig:var(--f-display);--ff-chip:var(--f-body);--ff-sub:var(--f-display);--ff-blk:var(--f-display);--ff-cap:var(--f-body);--ff-nav:var(--f-body);--ff-foot:var(--f-body);
  --gutter:clamp(16px,4vw,48px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:transparent;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--foto),var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.02em;line-height:1.02}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:var(--gutter)}
main.wrap{width:100%;flex:1 0 auto}
.rodape{position:relative}

/* topo */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px;font-size:.875rem;color:var(--muted)}
.brand{font-family:var(--f-display);font-weight:700;color:var(--ink);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,201,74,.25)}

/* hero */
.hero{--hs:clamp(2.6rem,9vw,6.6rem);padding-block:clamp(24px,6vw,64px) clamp(32px,6vw,56px);display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:end}
.hero h1{font-family:var(--ff-hero);color:var(--t-hero);font-weight:800;font-size:calc(var(--hs)*var(--z-hero,1));max-width:12ch}
.hero h1 .mov{color:var(--t-mov)}
.hero h1 .ponto{color:var(--t-dot)}
.hero .linha{display:flex;align-items:center;justify-content:flex-end;align-items:flex-end;height:calc(var(--hs)*1.02);padding-bottom:calc(var(--hs)*.01)}
.hero .nome{margin:0;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:clamp(.85rem,3.2vw,1.9rem);max-width:none;white-space:nowrap}
.hero .assinatura{display:block;margin:0;width:clamp(90px,19vw,250px);height:auto}
@media (max-width:360px){.hero{--hs:2.15rem}}
@media (max-width:640px){.hero{column-gap:10px}.hero .assinatura{width:clamp(64px,28vw,130px)}}
.hero p{margin-top:20px;max-width:52ch;color:var(--muted);font-size:clamp(1rem,2.2vw,1.2rem)}
.timeline{margin-top:clamp(28px,5vw,52px);border:1px solid var(--line);border-radius:14px;background:rgba(36,0,44,.38);padding:14px 16px 16px}
.tl-head{display:flex;justify-content:space-between;gap:12px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.tc{color:var(--accent);font-weight:600;letter-spacing:.06em}
.tl-grid{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:6px 10px;align-items:center}
.tl-grid>b{font-size:.75rem;color:var(--muted);font-weight:600}
.lanes{grid-column:2;grid-row:1 / span 2;display:grid;gap:6px;position:relative}
.lane{display:flex;gap:4px;height:34px;min-width:0}
.lane i{display:block;min-width:0;border-radius:6px;padding:0 8px;font-style:normal;font-size:.72rem;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane.v i{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lane.d i{background:transparent;border:1px solid var(--line);color:var(--muted)}
.playhead{position:absolute;top:-6px;bottom:-6px;left:0;width:2px;background:var(--ink);pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0;width:0;height:0;border-left-width:6px;border-right-width:6px}
.lbl-v{grid-column:1;grid-row:1}.lbl-d{grid-column:1;grid-row:2}

/* sobre mim */
.about-zone{border-top:1px solid var(--line);padding-top:16px}.about-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.about-tools:empty{display:none}
.about-btn{font-family:var(--ff-abbtn);color:var(--t-abbtn);background:none;border:0;border-radius:0;padding:4px 0;font-weight:600;font-size:calc(clamp(1.05rem,2.2vw,1.3rem)*var(--z-abbtn,1));display:inline-flex;align-items:center;gap:10px;cursor:pointer;transition:color .2s}
.about-btn::after{content:"";width:.5em;height:.5em;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-.12em) rotate(45deg);transition:transform .35s;opacity:.85}
.about-btn[aria-expanded="true"]::after{transform:translateY(.1em) rotate(225deg)}
:root.ab-eq .about-btn{font-size:calc(clamp(1.4rem,3vw,2rem)*var(--z-sec,1));font-weight:700}
.about-btn:hover{color:var(--accent-live,var(--accent))}
.about-btn small{font-weight:400;font-style:italic;opacity:.75;font-size:.72rem}
.about-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.about-wrap.open{grid-template-rows:1fr}
.about-in{min-height:0;overflow:hidden}
.about-wrap.open .about-in{padding-bottom:22px}
.about-card{width:var(--about-w,100%);display:grid;gap:14px 28px;grid-template-columns:var(--cols-d,minmax(0,1fr));grid-template-areas:var(--areas-d,'title' 'text');align-items:start;background:rgba(var(--about-rgb,111,0,133),var(--about-a,.55));border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,32px);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.about-card.al-left{margin-right:auto}.about-card.al-center{margin-inline:auto}.about-card.al-right{margin-left:auto}
.about-photo{grid-area:photo;margin:0;width:100%;aspect-ratio:var(--ph-r,4/5);overflow:hidden;background:rgba(0,0,0,.25)}
.about-photo img{width:100%;height:100%;object-fit:cover;display:block}
.s-soft .about-photo{border-radius:16px}.s-round .about-photo{border-radius:50%}.s-square .about-photo{border-radius:0}
.v-top .about-photo{align-self:start}.v-middle .about-photo{align-self:center}.v-bottom .about-photo{align-self:end}
.h-center .about-photo{width:var(--ph-w,34%);min-width:min(100%,160px);justify-self:center}
.about-title{grid-area:title;font-family:var(--ff-abt);color:var(--t-abt);font-size:calc(clamp(1.6rem,4vw,2.4rem)*var(--z-abt,1));font-weight:800;line-height:1.05}
.about-text{grid-area:text;min-width:0}
.about-blk h4{margin:0 0 4px;font-family:var(--ff-abs);color:var(--t-abs);font-size:calc(1.15rem*var(--z-abs,1));font-weight:700;line-height:1.2}
.about-blk p{margin:0;font-family:var(--ff-abx);color:var(--t-abx);white-space:pre-line;overflow-wrap:anywhere;line-height:1.65;font-size:calc(clamp(1rem,1.8vw,1.1rem)*var(--z-abx,1))}
.about-blk+.about-blk{margin-top:18px}
@media (max-width:720px){.about-card{width:100%;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto!important;grid-template-areas:var(--areas-m,'title' 'text')!important}.about-photo{width:min(100%,360px);justify-self:center;align-self:start!important}.h-center .about-photo{width:max(var(--ph-w,34%),min(100%,200px))}}

/* grade */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px;padding-top:8px}
.sec-head h2{font-family:var(--ff-sec);color:var(--t-sec);font-size:calc(clamp(1.4rem,3vw,2rem)*var(--z-sec,1));font-weight:700}
.sec-head span{color:var(--muted);font-size:.9rem}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.grid>li{min-width:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.card{min-width:0;width:100%;height:100%;text-align:left;display:flex;flex-direction:column;background:rgba(var(--card-rgb),.6);border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s}
.card:hover{transform:translateY(-6px);border-color:var(--detail);background:rgba(var(--card-rgb),.7)}
.thumb{position:relative;flex:none;width:100%;height:0;padding-top:62.5%;overflow:hidden;background:radial-gradient(120% 90% at var(--x,20%) 0%,rgba(43,0,52,.45),transparent 60%),linear-gradient(var(--a,135deg),var(--g1),var(--g2))}
.mono{position:absolute;left:18px;bottom:6px;font-family:var(--f-display);font-weight:800;font-size:clamp(3.8rem,8vw,5.2rem);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,243,252,.6);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover .mono{transform:translateX(8px);-webkit-text-stroke-color:var(--detail)}
.idx{position:absolute;top:14px;left:18px;font-size:.8rem;color:var(--muted);font-weight:600}
.rec{position:absolute;top:12px;right:14px;background:var(--detail);color:var(--ink);font-size:.7rem;font-weight:600;letter-spacing:.1em;padding:4px 9px;border-radius:99px}
.cbody{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody{min-width:0}
.cbody h3,.kind{overflow-wrap:anywhere;word-break:normal;hyphens:auto}
.cbody h3{font-family:var(--ff-card);color:var(--t-card);font-size:calc(1.35rem*var(--z-card,1));font-weight:700}
.kind{font-family:var(--ff-kind);color:var(--t-kind);font-size:calc(.92rem*var(--z-kind,1))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.chip{max-width:100%;overflow-wrap:anywhere;font-family:var(--ff-chip);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:.78rem;color:var(--t-chip)}
.chip.v{background:var(--detail);border-color:var(--detail);color:var(--t-chip)}
.grid{padding-bottom:56px}
.foot{padding-block:48px 56px;color:var(--muted);font-size:.85rem}

/* painel expandido */
.overlay{position:fixed;inset:0;z-index:50;display:flex;background:var(--bg)}
.overlay[hidden]{display:none}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--foto),var(--bg)}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px var(--gutter);border-bottom:1px solid var(--line)}
.crumbs{font-family:var(--ff-nav);display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:calc(.88rem*var(--z-nav,1));color:var(--t-nav);min-width:0}
.crumbs button{font-family:var(--ff-nav);background:none;border:0;padding:4px 2px;color:var(--t-nav);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--ink)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.close{font-family:var(--ff-nav);border:1px solid var(--line);background:rgba(255,243,252,.08);border-radius:99px;padding:8px 16px;font-weight:600;flex:none}
.close:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.p-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.p-in{flex:1 0 auto;width:100%;max-width:1200px;margin:0 auto;padding:clamp(24px,5vw,56px) var(--gutter) 72px}
.p-in h2{font-family:var(--ff-sec);color:var(--t-sec);font-size:calc(clamp(2.2rem,7vw,5rem)*var(--z-pg,1));font-weight:800;max-width:16ch}
.ig{display:inline-block;margin-top:14px;font-family:var(--ff-ig);font-weight:600;font-size:calc(clamp(1rem,2.4vw,1.35rem)*var(--z-ig,1));color:var(--t-ig);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
.ig:hover{border-bottom-color:var(--t-ig)}
.p-in .lead{font-family:var(--ff-lead);margin-top:16px;color:var(--t-lead);max-width:60ch;font-size:calc(clamp(1rem,2vw,1.15rem)*var(--z-lead,1))}
.p-in .chips{margin-top:20px;padding-top:0}
.block{margin-top:clamp(28px,5vw,48px)}
.secrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(20px,3.5vw,44px);align-items:start}
@media (max-width:820px){.secrow{grid-template-columns:minmax(0,1fr)}}
.block>h3{font-family:var(--ff-blk);color:var(--t-blk);font-size:calc(1.15rem*var(--z-blk,1));font-weight:700;display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.block>h3 small{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--detail)}
.dot.o{background:none;border:2px solid var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px;align-items:start}
.tile{margin:0;min-width:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms)}
.art{position:relative;aspect-ratio:var(--r,16/9);border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#8F1AA8,#3F004C);border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .2s}
.tile:hover .art{transform:scale(1.02);border-color:var(--detail)}
.art img.zoomable{cursor:zoom-in}
.art img.fit{object-fit:contain;background:rgba(10,0,14,.55)}
.art video,.art img{width:100%;height:100%;object-fit:cover;display:block}
.art video{object-fit:contain;background:#000}
.art video:fullscreen,.art video:-webkit-full-screen{object-fit:contain;width:100%;height:100%}
.art .ph{display:grid;justify-items:center;gap:10px;text-align:center;padding:12px;color:var(--muted);font-size:.8rem}
.art a.open{position:absolute;inset:0;align-content:center;color:var(--ink);text-decoration:none;font-weight:600}
.art a.open:hover .play{transform:scale(1.08)}
.play{transition:transform .25s;width:56px;height:56px;border-radius:50%;background:var(--detail);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(43,0,52,.35)}
.play svg{margin-left:3px}
.frame{width:44px;height:44px;border:2px dashed var(--muted);border-radius:8px;display:grid;place-items:center}
.cap{display:flex;align-items:center;gap:10px;margin-top:10px}
.cap b{font-family:var(--ff-cap);color:var(--t-cap);font-weight:600;font-size:calc(.95rem*var(--z-cap,1));line-height:1.3}
.tag{font-family:var(--ff-chip);flex:none;font-size:.66rem;letter-spacing:.1em;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.v{background:var(--detail);border-color:var(--detail);color:var(--ink)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.sub{text-align:left;display:flex;gap:14px;align-items:center;background:rgba(var(--card-rgb),.6);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .2s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.sub:hover{transform:translateY(-4px);border-color:var(--detail)}
.sub .m{flex:none;width:64px;height:64px;border-radius:12px;background:linear-gradient(var(--a,135deg),var(--g1),var(--g2));display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.sub h4{margin:0;color:var(--t-sub);font-family:var(--ff-sub);font-size:calc(1.1rem*var(--z-sub,1));line-height:1.15}
.sub p{font-family:var(--ff-kind);color:var(--t-kind);font-size:.85rem;margin-top:2px}



/* carrossel */
.subw{position:relative;min-width:0}
.subw .sub{width:100%;height:100%}
.onlyme{opacity:.75;font-style:italic;font-size:.72rem}
body.pf-preview .tile.empty{display:none}
.carcover{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.carcover img,.carcover video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.carbadge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(20,0,26,.78);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:.75rem;font-weight:600}
.lb{position:fixed;inset:0;z-index:70;background:rgba(8,0,12,.92);display:grid;place-items:center;touch-action:pan-y}
.lb[hidden]{display:none}
.lb-wrap{display:grid;grid-template-columns:44px auto 44px;grid-template-areas:"prev stage next" ". bar .";gap:12px 14px;align-items:center;justify-items:center;max-width:100vw;padding:0 12px}
.lb-stage{grid-area:stage;position:relative;width:min(calc(100vw - 44px*2 - 14px*2 - 24px),calc((100dvh - 170px) * var(--lr,1)),1100px);aspect-ratio:var(--lr,1);border-radius:14px;overflow:hidden;background:#000;user-select:none}
.lb-track{display:flex;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.lb-track>*{flex:none;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;background:#000}
.lb-btn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,243,252,.9);color:#2b0034;font-size:1.6rem;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.lb-btn:hover{background:var(--accent)}
.lb-btn[hidden]{display:grid;visibility:hidden;pointer-events:none}
.lb-prev{grid-area:prev}.lb-next{grid-area:next}
.lb-bar{grid-area:bar;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:20px}
@media (max-width:640px){
  .lb-wrap{grid-template-columns:44px minmax(0,1fr) 44px;grid-template-areas:"stage stage stage" "prev bar next";gap:12px 8px;width:100%}
  .lb-stage{grid-column:1/-1;width:min(calc(100vw - 24px),calc((100dvh - 190px) * var(--lr,1)))}
}
.expand{position:absolute;top:8px;left:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,0,26,.72);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.expand:hover{background:var(--accent);color:var(--accent-ink)}
.lb-close{position:absolute;top:14px;right:14px;z-index:3;border:1px solid var(--line);background:rgba(255,243,252,.1);border-radius:99px;padding:8px 16px;font-weight:600;color:var(--ink);cursor:pointer}
.lb-close:hover{background:var(--accent);color:var(--accent-ink)}
.lb-count{color:var(--ink);font-size:.82rem;font-weight:600;letter-spacing:.04em}
.lb-dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;max-width:100%}
.lb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,243,252,.4)}
.lb-dots i.on{background:#fff;transform:scale(1.2)}

/* rodapé */
.rodape{background:radial-gradient(120% 90% at 20% 0%,rgba(43,0,52,.45),transparent 60%),linear-gradient(135deg,var(--f1),var(--f2));border-top:1px solid var(--line);padding:28px var(--gutter);flex:none}
.contatos{list-style:none;margin:0 auto;padding:0;max-width:1200px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px 32px}
.contatos li,.contatos a{font-family:var(--ff-foot);display:flex;align-items:center;gap:10px;min-width:0;color:var(--t-foot);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.contatos a:hover span{text-decoration:underline;text-underline-offset:3px}

@media (max-width:760px){.contatos{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}}
@media (max-width:460px){.contatos{grid-template-columns:1fr}}
@media (min-width:760px){.tile.wide{grid-column:span 2}}
@media (max-width:520px){.tl-head span:last-child{display:none}.lane i{font-size:.66rem;padding:0 5px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}

<body>
<main class="wrap" id="main">
  <section class="hero">
    <h1 id="hero-t">Ideias em <span class="mov">movimento</span><span class="ponto">.</span></h1>
    <div class="linha">
      <img class="assinatura" src="assinatura.png" alt="Assinatura de Camily Schütz">
    </div>
  </section>

  <section aria-labelledby="clientes-t">
    <div class="about-zone"><div class="about-tools" id="about-tools"></div>
    <div class="about-wrap" id="about-wrap" role="region" aria-label="Sobre mim" inert><div class="about-in" id="about-in"></div></div></div>
    <div class="sec-head"><h2 id="clientes-t">Clientes e projetos</h2></div>
    <ul class="grid" id="grid"></ul>
  </section>
</main>

<footer class="rodape" id="foot"></footer>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title">
    <div class="p-top">
      <nav class="crumbs" id="crumbs" aria-label="Você está em"></nav>
      <button class="close" id="close" type="button">Fechar ✕</button>
    </div>
    <div class="p-scroll" id="pscroll"><div class="p-in" id="pbody"></div><footer class="rodape" id="foot2"></footer></div>
  </div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Galeria de imagens e vídeos">
  <button class="lb-close" id="lb-close" type="button">Fechar ✕</button>
  <div class="lb-wrap">
    <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Anterior">‹</button>
    <div class="lb-stage" id="lb-stage"><div class="lb-track" id="lb-track"></div></div>
    <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Próxima">›</button>
    <div class="lb-bar"><span class="lb-count" id="lb-count"></span><div class="lb-dots" id="lb-dots"></div></div>
  </div>
</div>

<script>
/* ===== CONTEÚDO =====
   Vem do servidor (/api/content). Se o servidor estiver fora do ar, usa seed.json. */
let CLIENTS = [], REV = 0, ORDER = [], SETTINGS = { bg:'', heroA:'Ideias em', heroB:'movimento', heroC:'.', tabTitle:'Portfólio de Design e Vídeo' };
const DEFAULT_ABOUT = { label:'Sobre mim', title:'Sobre mim', blocks:[], photo:'', ratio:'4/5', shape:'soft', size:34, h:'left', v:'top', width:100, align:'center', bg:'#6F0085', alpha:55 };

/* ===== AUXILIARES ===== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const real = w => !!(w.src || w.canva || (w.images && w.images.length));
const vis = ws => (window.PF_ADMIN ? ws : ws.filter(real));
const worksOf = c => [...vis(c.works||[]), ...(c.children||[]).flatMap(k => vis(k.works||[]))];
const nVid = c => worksOf(c).filter(w => w.t==='video').length;
const nDes = c => worksOf(c).filter(w => w.t!=='video').length;
const plural = (n,s,p) => n + ' ' + (n===1 ? s : p);

/* vídeos sempre primeiro: ordem estável por quantidade de vídeos */
function computeOrder(){ ORDER = CLIENTS.slice(); }

function chipsHTML(c){
  const v = nVid(c), d = nDes(c), k = (c.children||[]).length;
  return (v ? `<span class="chip v">▶ ${plural(v,'vídeo','vídeos')}</span>` : '')
       + (d ? `<span class="chip">${plural(d,'design','designs')}</span>` : '')
       + (k ? `<span class="chip">${plural(k,'projeto','projetos')}</span>` : '');
}

/* ===== RODAPÉ ===== */
const ICONS = {
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>',
  whatsapp:'<path d="M3 21l1.6-4.9A8.5 8.5 0 1 1 8 19.4L3 21z"/><path d="M9.2 8.6c.2 2.4 3.2 5.4 6 6l1.3-1.3-2-1.2-1 .8c-.9-.4-1.9-1.4-2.3-2.3l.8-1-1.2-2-1.6.9z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
let FOOTER = [];
function applySettings(){
  const st = SETTINGS;
  $('#hero-t').innerHTML = `${esc(st.heroA||'')} <span class="mov">${esc(st.heroB||'')}</span><span class="ponto">${esc(st.heroC||'')}</span>`;
  document.title = st.tabTitle || 'Portfólio';
  const img = st.bg || 'fundo.jpg';
  document.documentElement.style.setProperty('--foto', `linear-gradient(rgba(var(--veil),.80),rgba(var(--veil),.80)),url(${img}) center 25%/cover no-repeat`);
  applyTheme(st.theme || {});
  renderAbout();
}
/* ===== SOBRE MIM ===== */
let aboutOpen = false;
const getAbout = () => ({ ...DEFAULT_ABOUT, ...(SETTINGS.about || {}) });
const aboutHas = a => !!(a.photo || (a.blocks||[]).some(b => b.title || b.text));
function aboutAreas(a){
  const hasP = !!a.photo, hasT = !!a.title, q = x => "'" + x + "'";
  const stack = o => o.filter(Boolean).map(q).join(' ');
  let order;
  if(!hasP) order = [hasT && 'title', 'text'];
  else if(a.h === 'center') order = a.v === 'top' ? ['photo', hasT && 'title', 'text'] : a.v === 'middle' ? [hasT && 'title', 'photo', 'text'] : [hasT && 'title', 'text', 'photo'];
  else order = ['photo', hasT && 'title', 'text'];
  const mobile = stack(order); let desk = mobile, cols = 'minmax(0,1fr)';
  if(hasP && a.h !== 'center'){
    const tx = hasT ? ['title','text'] : ['text'];
    if(a.h === 'left'){ cols = 'minmax(140px,var(--ph-w)) minmax(0,1fr)'; desk = tx.map(t => q('photo ' + t)).join(' '); }
    else { cols = 'minmax(0,1fr) minmax(140px,var(--ph-w))'; desk = tx.map(t => q(t + ' photo')).join(' '); }
  }
  return { desk, cols, mobile };
}
function aboutCardHTML(a){
  a = { ...DEFAULT_ABOUT, ...(a || {}) };
  const ar = aboutAreas(a);
  const style = `--about-w:${a.width}%;--about-rgb:${hexRgb(a.bg)};--about-a:${a.alpha/100};--ph-w:${a.size}%;--ph-r:${a.shape==='round'?'1/1':esc(a.ratio)};--cols-d:${ar.cols};--areas-d:${ar.desk};--areas-m:${ar.mobile}`;
  const photo = a.photo ? `<figure class="about-photo"><img src="${esc(a.photo)}" alt="${esc(a.title||'Foto')}"></figure>` : '';
  const title = a.title ? `<h3 class="about-title">${esc(a.title)}</h3>` : '';
  const blocks = (a.blocks||[]).map(b => `<div class="about-blk">${b.title?`<h4>${esc(b.title)}</h4>`:''}${b.text?`<p>${esc(b.text)}</p>`:''}</div>`).join('');
  return `<article class="about-card h-${a.h} v-${a.v} s-${a.shape} al-${a.align}" style="${style}">${photo}${title}<div class="about-text">${blocks}</div></article>`;
}
function renderAbout(){
  const a = getAbout(), has = aboutHas(a), adm = !!AD();
  const tools = $('#about-tools'), wrap = $('#about-wrap'), inner = $('#about-in');
  if(!tools) return;
  if(!has && !adm){ tools.innerHTML = ''; inner.innerHTML = ''; wrap.classList.remove('open'); wrap.inert = true; aboutOpen = false; return; }
  tools.innerHTML = `<button type="button" class="about-btn" id="about-btn" aria-expanded="${aboutOpen}" aria-controls="about-wrap">${esc(a.label || 'Sobre mim')}</button>${AD()?AD().about():''}`;
  inner.innerHTML = aboutCardHTML(a);
  wrap.classList.toggle('open', aboutOpen); wrap.inert = !aboutOpen;
}
document.addEventListener('click', e => {
  const b = e.target.closest('#about-btn'); if(!b) return;
  aboutOpen = !aboutOpen; b.setAttribute('aria-expanded', aboutOpen);
  const w = $('#about-wrap'); w.classList.toggle('open', aboutOpen); w.inert = !aboutOpen;
});
/* ===== APARÊNCIA ===== */
const T_COLOR = { c_veil:['--veil',1], c_cardbg:['--card-rgb',1], c_line:['--line-rgb',1], c_ink:['--ink'], c_muted:['--muted'], c_accent:['--accent'], c_detail:['--detail'], c_hero:['--t-hero'], c_mov:['--t-mov'], c_dot:['--t-dot'], c_sec:['--t-sec'], c_card:['--t-card'], c_kind:['--t-kind'], c_lead:['--t-lead'], c_ig:['--t-ig'], c_chip:['--t-chip'], c_sub:['--t-sub'], c_blk:['--t-blk'], c_cap:['--t-cap'], c_nav:['--t-nav'], c_foot:['--t-foot'], c_f1:['--f1'], c_f2:['--f2'], c_g1:['--g1'], c_g2:['--g2'], c_abbtn:['--t-abbtn'], c_abt:['--t-abt'], c_abs:['--t-abs'], c_abx:['--t-abx'] };
const T_FONT = { f_body:'--f-body', f_display:'--f-display', f_hero:'--ff-hero', f_sec:'--ff-sec', f_card:'--ff-card', f_kind:'--ff-kind', f_lead:'--ff-lead', f_ig:'--ff-ig', f_chip:'--ff-chip', f_sub:'--ff-sub', f_blk:'--ff-blk', f_cap:'--ff-cap', f_nav:'--ff-nav', f_foot:'--ff-foot', f_abbtn:'--ff-abbtn', f_abt:'--ff-abt', f_abs:'--ff-abs', f_abx:'--ff-abx' };
const SYS_FONTS = { 'Arial':'Arial,Helvetica,sans-serif', 'Verdana':'Verdana,Geneva,sans-serif', 'Tahoma':'Tahoma,Geneva,sans-serif', 'Trebuchet MS':'"Trebuchet MS",Helvetica,sans-serif', 'Georgia':'Georgia,serif', 'Times New Roman':'"Times New Roman",Times,serif', 'Courier New':'"Courier New",Courier,monospace', 'Impact':'Impact,Haettenschweiler,sans-serif' };
const BUILTIN_FONTS = ['Bricolage Grotesque','Figtree'];
const hexRgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16)).join(',');
function fontCSS(v){
  let m = /^g:([A-Za-z0-9 ]{2,40})\|/.exec(v||''); if(m) return `'${m[1]}',system-ui,sans-serif`;
  m = /^s:([A-Za-z ]{2,30})$/.exec(v||''); if(m && SYS_FONTS[m[1]]) return SYS_FONTS[m[1]];
  return '';
}
function fontHref(v){
  const m = /^g:([A-Za-z0-9 ]{2,40})\|(\d{3}(?:;\d{3}){0,5})$/.exec(v||'');
  return m && !BUILTIN_FONTS.includes(m[1]) ? 'https://fonts.googleapis.com/css2?family=' + m[1].replace(/ /g,'+') + ':wght@' + m[2] + '&display=swap' : '';
}
/* uma <link> por fonte: se uma fonte falhar, as outras continuam funcionando */
function loadFonts(list){
  const want = new Set(list.map(fontHref).filter(Boolean));
  document.querySelectorAll('link[data-pf-font]').forEach(l => { if(!want.has(l.getAttribute('href'))) l.remove(); });
  const have = new Set([...document.querySelectorAll('link[data-pf-font]')].map(l => l.getAttribute('href')));
  for(const href of want) if(!have.has(href)){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.setAttribute('data-pf-font',''); l.href = href; document.head.append(l); }
}
const ZK = ['z_hero','z_sec','z_pg','z_card','z_kind','z_lead','z_blk','z_cap','z_sub','z_nav','z_ig','z_abbtn','z_abt','z_abs','z_abx'];
function applyTheme(t){
  const root = document.documentElement.style;
  for(const [k,[v,tri]] of Object.entries(T_COLOR)){
    if(/^#[0-9a-fA-F]{6}$/.test(t[k]||'')) root.setProperty(v, tri ? hexRgb(t[k]) : t[k]); else root.removeProperty(v);
  }
  const fonts = [];
  for(const [k,v] of Object.entries(T_FONT)){
    const css = fontCSS(t[k]); if(css){ root.setProperty(v, css); fonts.push(t[k]); } else root.removeProperty(v);
  }
  const el = document.documentElement;
  for(const k of ZK){
    const v = t[k], n = /^\d{2,3}$/.test(v||'') ? +v : 0;
    if(n >= 50 && n <= 300) root.setProperty('--z-'+k.slice(2), n/100); else root.removeProperty('--z-'+k.slice(2));
  }
  el.classList.toggle('ab-eq', t.z_abbtn === '=sec');
  loadFonts(fonts);
}
function footerHTML(){
  const items = FOOTER.map(i => {
    const svg = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[i.icon] || ICONS.link}</svg>`;
    const inner = `${svg}<span>${esc(i.text || '')}</span>`;
    if(!i.href) return `<li>${inner}</li>`;
    const ext = /^https?:/.test(i.href) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return `<li><a href="${esc(i.href)}"${ext}>${inner}</a></li>`;
  }).join('');
  return `<ul class="contatos">${items}</ul>${AD()?AD().footer():''}`;
}
function renderFooter(){ const h = footerHTML(); $('#foot').innerHTML = h; $('#foot2').innerHTML = h; }

/* ===== GRADE ===== */
const grid = $('#grid');
const AD = () => window.PF_ADMIN || null;
function renderGrid(){
  grid.innerHTML = ORDER.map((c,i) => `
  <li style="--i:${i}" data-cid="${c.id}">
    <button class="card" type="button" data-id="${c.id}" aria-label="Abrir ${esc(c.name||'projeto')}">
      <div class="thumb" style="--a:${120+i*37}deg;--x:${(i*23)%80+10}%${c.cover?`;background:url(${c.cover}) center/cover no-repeat`:''}">
      </div>
      <div class="cbody">
        ${c.name?`<h3>${esc(c.name)}</h3>`:''}
        ${c.kind?`<p class="kind">${esc(c.kind)}</p>`:''}
        <div class="chips">${chipsHTML(c)}</div>
      </div>
    </button>${AD()?AD().card(c):''}
  </li>`).join('') + (AD()?AD().newCard():'');
}

/* ===== PAINEL ===== */
const overlay = $('#overlay'), pbody = $('#pbody'), pscroll = $('#pscroll'), crumbs = $('#crumbs'), closeBtn = $('#close');
let currentKey = null, currentClient = null, closing = false;

function lookup(id){
  for(const c of CLIENTS){
    if(c.id===id) return {c, k:null};
    const k = (c.children||[]).find(x => x.id===id);
    if(k) return {c, k};
  }
  return null;
}

function tileHTML(w, i, tag = true){
  const video = w.t==='video';
  const wide = video && w.r==='16/9' ? ' wide' : '';
  let art;
  if(w.t==='carousel'){
    const im = w.images||[];
    art = im.length ? `<button type="button" class="carcover" data-car="${curItem.works.indexOf(w)}" aria-label="Abrir carrossel">${(w.kinds&&w.kinds[0]==='v')?`<video src="${esc(im[0])}#t=0.1" muted playsinline preload="metadata" tabindex="-1" aria-label="${esc(w.title||'Carrossel')}"></video>`:`<img src="${esc(im[0])}" alt="${esc(w.title||'Carrossel')}" loading="lazy">`}<span class="carbadge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="14" height="14" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>${im.length}</span></button>` : `<div class="ph"><span>Carrossel vazio</span></div>`;
  } else if(w.canva){
    art = `<a class="ph open" href="${esc(w.canva)}" target="_blank" rel="noopener noreferrer"><span class="play"><svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M2 2l16 9-16 9z" fill="#FFF3FC"/></svg></span><span>Abrir apresentação no Canva ↗</span></a>`;
  } else if(w.src){
    art = video ? (w.poster ? `<video src="${esc(w.src)}${w.posterT?'#t='+w.posterT:''}" poster="${esc(w.poster)}"${w.posterT?` data-pt="1" data-ptt="${w.posterT}"`:''} controls controlslist="nofullscreen" playsinline preload="metadata"></video>` : `<video src="${esc(w.src)}#t=0.1" controls controlslist="nofullscreen" playsinline preload="metadata"></video>`)
                : `<img class="zoomable${w.fit==='contain'?' fit':''}" data-zoom src="${esc(w.src)}" alt="${esc(w.title)}" loading="lazy" tabindex="0" role="button" aria-label="Ampliar imagem">`;
  } else if(video){
    art = `<div class="ph"><span class="play"><svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M2 2l16 9-16 9z" fill="#FFF3FC"/></svg></span><span>Seu vídeo aqui</span>${AD()?'<small class="onlyme">visível só para você</small>':''}</div>`;
  } else {
    art = `<div class="ph"><span class="frame"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#E8C3F2" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="2"/><path d="M3 17l5-5 4 4 3-3 4 4"/></svg></span><span>Seu trabalho aqui</span>${AD()?'<small class="onlyme">visível só para você</small>':''}</div>`;
  }
  return `<figure class="tile${wide}${real(w)?'':' empty'}" data-wi="${curItem.works.indexOf(w)}" style="--i:${i};--r:${w.r||'16/9'}">
    <div class="art">${art}${(video&&w.src&&!w.canva)?`<button type="button" class="expand" data-expand aria-label="Ampliar vídeo" title="Ampliar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>`:''}${AD()?AD().tile(curItem, curItem.works.indexOf(w)):''}</div>
    ${w.title?`<figcaption class="cap">${(video||!tag)?'':'<span class="tag">DESIGN</span>'}<b>${esc(w.title)}</b></figcaption>`:''}
  </figure>`;
}

function section(title, list, isVideo, key, custom){
  const ad = AD();
  if(!list.length && !(ad && custom)) return '';
  const inner = list.length ? `<div class="tiles">${list.map((w,i)=>tileHTML(w,i,!custom)).join('')}</div>`
    : `<p class="pf-a pf-empty">Categoria vazia. Use os botões acima para adicionar. <em>(visível só para você)</em></p>`;
  return `<section class="block" data-sec="${esc(key)}"><h3><span class="dot${isVideo?'':' o'}"></span>${esc(title)}<small>${plural(list.length,'trabalho','trabalhos')}</small></h3>
    ${ad?ad.sec(curItem,key,!!custom,title)+ad.lay(curItem,key):''}${inner}</section>`;
}

let curItem = null, curNested = false;
/* ordem e colunas das categorias: lista de linhas, cada linha com 1 ou 2 categorias (p = Projetos, v = Vídeos, d = Design/Trabalhos, ou o id da categoria) */
function layoutRows(item, nested){
  const all = []; if(!nested && item.children) all.push('p'); all.push('v','d', ...(item.groups||[]).map(g => g.id));
  const seen = new Set(), rows = [];
  for(const r of (item.layout||[])){
    const row = (Array.isArray(r) ? r : []).filter(k => all.includes(k) && !seen.has(k) && seen.add(k)).slice(0,2);
    if(row.length) rows.push(row);
  }
  for(const k of all) if(!seen.has(k)){ if(k==='p') rows.unshift([k]); else rows.push([k]); }
  return rows;
}
function render(c, k){
  curNested = !!k;
  const item = k || c;
  curItem = item;
  const works = vis(item.works || []);
  const groups = item.groups || [];
  const inG = w => !!w.g && groups.some(g => g.id===w.g);
  const vids = works.filter(w => w.t==='video' && !inG(w));
  const others = works.filter(w => w.t!=='video' && !inG(w));
  crumbs.innerHTML = `<button type="button" data-go="">Portfólio</button><span aria-hidden="true">›</span>` +
    (k ? `<button type="button" data-go="${c.id}">${esc(c.name||'Projeto')}</button><span aria-hidden="true">›</span><span aria-current="page">${esc(k.name||'Projeto')}</span>`
       : `<span aria-current="page">${esc(c.name||'Projeto')}</span>`);
  const subs = (!k && c.children) ? `<section class="block" data-sec="p"><h3><span class="dot o"></span>Projetos<small>${plural(c.children.length,'projeto','projetos')}</small></h3>${AD()?AD().lay(item,'p'):''}
    <div class="subs">${c.children.map((s,i)=>`
      <div class="subw" data-sid="${s.id}"><button class="sub" type="button" data-go="${s.id}" style="--i:${i};--a:${120+i*50}deg">
        <span><h4>${esc(s.name||'Projeto')}</h4>${s.kind?`<p>${esc(s.kind)}</p>`:''}</span>
      </button>${AD()?AD().sub(s):''}</div>`).join('')}</div></section>` : '';
  const ig = item.ig ? `<a class="ig" href="https://www.instagram.com/${esc(item.ig)}/" target="_blank" rel="noopener noreferrer">@${esc(item.ig)}</a>` : '';
  pbody.innerHTML = `<h2 id="p-title"${item.name?'':' hidden'}>${esc(item.name)}</h2>
    ${ig}
    ${item.desc?`<p class="lead">${esc(item.desc)}</p>`:''}
    <div class="chips">${chipsHTML(item)}</div>
    ${AD()?AD().head(item, !!k):''}
    ${layoutRows(item, !!k).map(row => {
      const h = row.map(key => key==='p' ? subs : key==='v' ? section(item.secV||'Vídeos', vids, true, 'v')
        : key==='d' ? section(item.secD||(vids.length ? 'Design e materiais' : 'Trabalhos'), others, false, 'd')
        : (g => g ? section(g.name||'Categoria', works.filter(w => w.g===g.id), false, g.id, true) : '')(groups.find(g => g.id===key))).filter(Boolean);
      return h.length>1 ? `<div class="secrow">${h.join('')}</div>` : h.join('');
    }).join('')}`;
}

function originClip(c){
  const el = grid.querySelector(`[data-id="${c.id}"]`);
  if(!el) return null;
  const r = el.getBoundingClientRect();
  return `inset(${Math.max(r.top,0)}px ${Math.max(innerWidth-r.right,0)}px ${Math.max(innerHeight-r.bottom,0)}px ${Math.max(r.left,0)}px round 20px)`;
}
const FULL = 'inset(0px 0px 0px 0px round 0px)';

function lockUI(on){
  ['topbar','main','foot'].forEach(id => { const e = document.getElementById(id); if(e) e.inert = on; });
  document.documentElement.style.overflow = on ? 'hidden' : '';
}

function openPanel(c, k){
  stopVideos();
  const first = overlay.hidden;
  currentClient = c;
  render(c, k);
  pscroll.scrollTop = 0;
  if(first){
    overlay.hidden = false;
    lockUI(true);
    const from = originClip(c);
    if(!RM && from) overlay.animate([{clipPath:from},{clipPath:FULL}], {duration:560, easing:'cubic-bezier(.2,.8,.2,1)'});
    else if(!RM) overlay.animate([{opacity:0},{opacity:1}], {duration:250});
    closeBtn.focus({preventScroll:true});
  } else if(!RM){
    pbody.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}], {duration:380, easing:'cubic-bezier(.2,.8,.2,1)'});
  }
}

function stopVideos(except){ document.querySelectorAll('video').forEach(v => { if(v !== except && !v.paused) v.pause(); }); }
/* só um vídeo toca por vez */
document.addEventListener('play', e => { if(e.target && e.target.tagName === 'VIDEO') stopVideos(e.target); }, true);

function closePanel(){
  if(overlay.hidden || closing) return;
  closing = true; stopVideos();
  const c = currentClient;
  const done = () => {
    overlay.hidden = true; closing = false; lockUI(false);
    const btn = c && grid.querySelector(`[data-id="${c.id}"]`);
    if(btn) btn.focus({preventScroll:true});
  };
  const to = c && originClip(c);
  if(RM) return done();
  const a = overlay.animate([{clipPath:FULL},{clipPath: to || 'inset(50% 50% 50% 50% round 20px)'}], {duration:440, easing:'cubic-bezier(.5,0,.2,1)', fill:'forwards'});
  a.finished.then(() => { done(); a.cancel(); }).catch(done);
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const hit = id && lookup(id);
  if(!hit){ currentKey = null; closePanel(); return; }
  if(currentKey === id && !overlay.hidden) return;
  currentKey = id;
  openPanel(hit.c, hit.k);
}
function go(id){
  if(location.hash.slice(1) !== id){ try{ location.hash = id; }catch(e){} }
  route();
}

grid.addEventListener('click', e => {
  const b = e.target.closest('.card'); if(b) go(b.dataset.id);
});
pbody.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if(b) go(b.dataset.go);
});
crumbs.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if(b) go(b.dataset.go);
});
closeBtn.addEventListener('click', () => go(''));
document.addEventListener('keydown', e => {
  if(e.key!=='Escape' || overlay.hidden) return;
  const hit = lookup(currentKey || '');
  go(hit && hit.k ? hit.c.id : '');
});
addEventListener('hashchange', route);

/* ===== CARROSSEL (janela com setinhas, estilo Instagram) ===== */
const lb = $('#lb'), lbTrack = $('#lb-track'), lbStage = $('#lb-stage');
let lbS = [], lbI = 0, lbOpener = null;
function parseR(v){ if(typeof v==='number') return v||1; v = String(v||''); if(v.includes('/')){ const [a,b] = v.split('/').map(Number); return (a/b)||1; } return Number(v)||1; }
function lbRatio(){ const s = lbS[lbI]; lbStage.style.setProperty('--lr', Math.min(3, Math.max(.4, s ? s.lr : 1)).toFixed(4)); }
function lbShow(i){
  lbI = Math.max(0, Math.min(lbS.length-1, i));
  lbTrack.style.transform = `translateX(${-100*lbI}%)`;
  $('#lb-count').textContent = `${lbI+1} / ${lbS.length}`;
  $('#lb-prev').hidden = lbI===0; $('#lb-next').hidden = lbI===lbS.length-1;
  $('#lb-dots').innerHTML = lbS.length>1 && lbS.length<=30 ? lbS.map((_,k)=>`<i class="${k===lbI?'on':''}"></i>`).join('') : '';
  $('#lb-count').hidden = lbS.length<2;
  lbRatio();
  lbTrack.querySelectorAll('video').forEach(v => { const k = Number(v.dataset.k); if(k!==lbI && !v.paused) v.pause(); if(Math.abs(k-lbI)<=1 && v.preload==='none') v.preload = 'metadata'; });
}
function lbOpen(slides, start){
  lbS = slides; if(!lbS.length) return;
  start = Math.max(0, Math.min(lbS.length-1, start||0));
  stopVideos();
  lbTrack.innerHTML = lbS.map((x,k)=>{
    const near = Math.abs(k-start)<2;
    return x.video
      ? `<video data-k="${k}" src="${esc(x.src)}${x.posterT?'#t='+x.posterT:''}"${x.poster?` poster="${esc(x.poster)}"`:''} controls playsinline preload="${near?'metadata':'none'}"></video>`
      : `<img data-k="${k}" src="${esc(x.src)}" alt="${esc(x.title||'Imagem')} ${k+1}" ${near?'':'loading="lazy"'}>`;
  }).join('');
  lbOpener = document.activeElement; lb.hidden = false;
  lbTrack.style.transition = 'none'; lbShow(start); void lbTrack.offsetWidth; lbTrack.style.transition = '';
  $('#lb-close').focus({preventScroll:true});
}
/* proporção real do arquivo assim que ele carrega */
function lbRatioFrom(e){
  const el = e.target; if(!el.dataset || el.dataset.k==null) return;
  const w = el.videoWidth || el.naturalWidth, h = el.videoHeight || el.naturalHeight; if(!w || !h) return;
  const k = Number(el.dataset.k); if(lbS[k]){ lbS[k].lr = w/h; if(k===lbI) lbRatio(); }
}
lbTrack.addEventListener('load', lbRatioFrom, true);
lbTrack.addEventListener('loadedmetadata', lbRatioFrom, true);
function openCarousel(w, start){
  const im = w.images || []; const lr = parseR(w.r||'1/1');
  lbOpen(im.map((u,k) => ({ src:u, title:w.title, lr, video:!!(w.kinds && w.kinds[k]==='v') })), start);
}
/* galeria: todas as fotos, GIFs e vídeos do item aberto, na ordem em que aparecem na página */
function openGallery(tile){
  if(!curItem || !tile) return;
  const list = [], idx = new Map();
  pbody.querySelectorAll('[data-wi]').forEach(t => {
    const w = curItem.works[Number(t.dataset.wi)];
    if(!w || w.t==='carousel' || w.canva || !w.src || idx.has(t)) return;
    const art = t.querySelector('.art');
    const r = (art && art.style.getPropertyValue('--r')) || t.style.getPropertyValue('--r') || w.r || '1/1';
    const v = w.t==='video';
    idx.set(t, list.length);
    list.push({ src:w.src, title:w.title, video:v, poster:v?w.poster:'', posterT:v?w.posterT:0, lr:parseR(r) });
  });
  lbOpen(list, idx.has(tile) ? idx.get(tile) : 0);
}
function closeCarousel(){
  lb.hidden = true; lbTrack.querySelectorAll('video').forEach(v => v.pause()); lbTrack.innerHTML = '';
  if(lbOpener && lbOpener.focus) lbOpener.focus({preventScroll:true});
}
$('#lb-prev').addEventListener('click', () => lbShow(lbI-1));
$('#lb-next').addEventListener('click', () => lbShow(lbI+1));
$('#lb-close').addEventListener('click', closeCarousel);
lb.addEventListener('click', e => { if(e.target===lb || e.target.classList.contains('lb-wrap')) closeCarousel(); });
addEventListener('keydown', e => {
  if(lb.hidden) return;
  if(e.key==='Escape'){ e.stopImmediatePropagation(); closeCarousel(); }
  else if(e.key==='ArrowLeft'){ e.stopImmediatePropagation(); lbShow(lbI-1); }
  else if(e.key==='ArrowRight'){ e.stopImmediatePropagation(); lbShow(lbI+1); }
}, true);
let swX = null;
lbStage.addEventListener('pointerdown', e => { if(!e.target.closest('.lb-btn,video')) swX = e.clientX; });
addEventListener('pointerup', e => {
  if(swX===null) return; const dx = e.clientX - swX; swX = null;
  if(Math.abs(dx) > 45) lbShow(lbI + (dx < 0 ? 1 : -1));
});
/* vídeo com capa escolhida: a capa é o frame #t; ao dar play sem ter mexido na barra, começa do início */
pbody.addEventListener('seeked', e => { const v = e.target; if(v.dataset && v.dataset.pt && Math.abs(v.currentTime - Number(v.dataset.ptt)) > 0.6) delete v.dataset.pt; }, true);
pbody.addEventListener('play', e => { const v = e.target; if(v.dataset && v.dataset.pt){ delete v.dataset.pt; try{ v.currentTime = 0; }catch(_){} } }, true);
/* o quadro do vídeo acompanha a proporção real do arquivo (nada cortado) */
pbody.addEventListener('loadedmetadata', e => {
  const v = e.target; if(!v.videoWidth || !v.videoHeight || !v.closest) return;
  const a = v.closest('.art'); if(a) a.style.setProperty('--r', Math.min(3, Math.max(.4, v.videoWidth / v.videoHeight)).toFixed(4));
}, true);
function zoomImg(img){ const f = img.closest('[data-wi]'); if(f) openGallery(f); }
pbody.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && e.target.matches('img[data-zoom]')){ e.preventDefault(); zoomImg(e.target); } });
pbody.addEventListener('click', e => {
  const z = e.target.closest('img[data-zoom]'); if(z){ zoomImg(z); return; }
  const x = e.target.closest('[data-expand]'); if(x){ openGallery(x.closest('[data-wi]')); return; }
  const c = e.target.closest('[data-car]'); if(!c || !curItem) return;
  openCarousel(curItem.works[Number(c.dataset.car)], 0);
});

/* API para o painel de administração (só é carregado para quem está logada) */
window.PF = {
  openCarousel, applyTheme, aboutCardHTML, renderAbout, get about(){ return getAbout(); },
  get clients(){ return CLIENTS; }, get rev(){ return REV; }, set rev(v){ REV = v; },
  setClients(list, rev, footer, settings){ CLIENTS = list; if(rev!=null) REV = rev; if(footer) FOOTER = footer; if(settings) SETTINGS = settings; this.refresh(); },
  get settings(){ return SETTINGS; }, set settings(v){ SETTINGS = v; },
  get footer(){ return FOOTER; }, set footer(v){ FOOTER = v; },
  get key(){ return currentKey; }, lookup, go, esc, layout: item => layoutRows(item, curNested),
  refresh(){
    computeOrder(); renderGrid(); renderFooter(); applySettings();
    if(!overlay.hidden){
      const hit = lookup(currentKey || '');
      if(hit){ currentClient = hit.c; render(hit.c, hit.k); } else go('');
    }
  }
};

(async function boot(){
  let data = null;
  try{ const r = await fetch('/api/content'); if(r.ok) data = await r.json(); }catch(e){}
  if(!data){ try{ const sd = await (await fetch('seed.json')).json(); data = { clients: sd.clients, footer: sd.footer, settings: sd.settings, rev: 0 }; }catch(e){ data = { clients: [], footer: [], rev: 0 }; } }
  CLIENTS = data.clients; REV = data.rev; FOOTER = data.footer || []; if(data.settings) SETTINGS = data.settings;
  computeOrder(); renderGrid(); renderFooter(); applySettings(); route();
  try{
    const me = await (await fetch('/api/me')).json();
    if(me.admin){ const sc = document.createElement('script'); sc.src = '/api/admin-ui.js'; document.head.append(sc); }
  }catch(e){}
})();
</script>

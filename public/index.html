<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio de Design e Vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: hero com linha do tempo de edição (vídeo acima, design abaixo) + grade de cards que expandem em tela cheia. */
  --bg:#6F0085;
  --bg-deep:#42004F;
  --bg-lift:#8F1AA8;
  --ink:#FFF3FC;
  --muted:#E8C3F2;
  --accent:#FFC94A;
  --accent-ink:#2B0034;
  --detail:#2B0034;
  --foto:linear-gradient(rgba(43,0,52,.80),rgba(43,0,52,.80)),url(fundo.jpg) center 25%/cover no-repeat;
  --line:rgba(255,243,252,.24);
  --f-display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gutter:clamp(16px,4vw,48px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:transparent;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--foto),var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.02em;line-height:1.02}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:var(--gutter)}
main.wrap{width:100%;flex:1 0 auto}
.rodape{position:relative}

/* topo */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px;font-size:.875rem;color:var(--muted)}
.brand{font-family:var(--f-display);font-weight:700;color:var(--ink);letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(255,201,74,.25)}

/* hero */
.hero{padding-block:clamp(24px,6vw,64px) clamp(32px,6vw,56px);display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;align-items:end}
.hero h1{font-weight:800;font-size:clamp(2.6rem,9vw,6.6rem);max-width:12ch}
.hero h1 .mov{color:#A524BF}
.hero h1 .ponto{color:#FFFFFF}
.hero .linha{display:flex;align-items:center;justify-content:flex-end;align-items:flex-end;height:calc(clamp(2.6rem,9vw,6.6rem)*1.02);padding-bottom:calc(clamp(2.6rem,9vw,6.6rem)*.01)}
.hero .nome{margin:0;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:clamp(.85rem,3.2vw,1.9rem);max-width:none;white-space:nowrap}
.hero .assinatura{display:block;margin:0;width:clamp(90px,19vw,250px);height:auto}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .linha{height:auto;margin-top:14px;padding-bottom:0}.hero .assinatura{width:130px}}
.hero p{margin-top:20px;max-width:52ch;color:var(--muted);font-size:clamp(1rem,2.2vw,1.2rem)}
.timeline{margin-top:clamp(28px,5vw,52px);border:1px solid var(--line);border-radius:14px;background:rgba(36,0,44,.38);padding:14px 16px 16px}
.tl-head{display:flex;justify-content:space-between;gap:12px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.tc{color:var(--accent);font-weight:600;letter-spacing:.06em}
.tl-grid{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:6px 10px;align-items:center}
.tl-grid>b{font-size:.75rem;color:var(--muted);font-weight:600}
.lanes{grid-column:2;grid-row:1 / span 2;display:grid;gap:6px;position:relative}
.lane{display:flex;gap:4px;height:34px;min-width:0}
.lane i{display:block;min-width:0;border-radius:6px;padding:0 8px;font-style:normal;font-size:.72rem;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane.v i{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lane.d i{background:transparent;border:1px solid var(--line);color:var(--muted)}
.playhead{position:absolute;top:-6px;bottom:-6px;left:0;width:2px;background:var(--ink);pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0;width:0;height:0;border-left-width:6px;border-right-width:6px}
.lbl-v{grid-column:1;grid-row:1}.lbl-d{grid-column:1;grid-row:2}

/* grade */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px;border-top:1px solid var(--line);padding-top:20px}
.sec-head h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:700}
.sec-head span{color:var(--muted);font-size:.9rem}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.grid>li{min-width:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.card{width:100%;height:100%;text-align:left;display:flex;flex-direction:column;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:20px;padding:0;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s}
.card:hover{transform:translateY(-6px);border-color:var(--detail);background:rgba(0,0,0,.7)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:radial-gradient(120% 90% at var(--x,20%) 0%,rgba(43,0,52,.45),transparent 60%),linear-gradient(var(--a,135deg),#A524BF,#4A0058)}
.mono{position:absolute;left:18px;bottom:6px;font-family:var(--f-display);font-weight:800;font-size:clamp(3.8rem,8vw,5.2rem);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,243,252,.6);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.card:hover .mono{transform:translateX(8px);-webkit-text-stroke-color:var(--detail)}
.idx{position:absolute;top:14px;left:18px;font-size:.8rem;color:var(--muted);font-weight:600}
.rec{position:absolute;top:12px;right:14px;background:var(--detail);color:var(--ink);font-size:.7rem;font-weight:600;letter-spacing:.1em;padding:4px 9px;border-radius:99px}
.cbody{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody h3{font-size:1.35rem;font-weight:700}
.kind{color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.chip{border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:.78rem;color:var(--ink)}
.chip.v{background:var(--detail);border-color:var(--detail);color:var(--ink)}
.grid{padding-bottom:56px}
.foot{padding-block:48px 56px;color:var(--muted);font-size:.85rem}

/* painel expandido */
.overlay{position:fixed;inset:0;z-index:50;display:flex;background:var(--bg)}
.overlay[hidden]{display:none}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--foto),var(--bg)}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px var(--gutter);border-bottom:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);min-width:0}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--ink)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.close{border:1px solid var(--line);background:rgba(255,243,252,.08);border-radius:99px;padding:8px 16px;font-weight:600;flex:none}
.close:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.p-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.p-in{flex:1 0 auto;width:100%;max-width:1200px;margin:0 auto;padding:clamp(24px,5vw,56px) var(--gutter) 72px}
.p-in h2{font-size:clamp(2.2rem,7vw,5rem);font-weight:800;max-width:16ch}
.ig{display:inline-block;margin-top:14px;font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,2.4vw,1.35rem);color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
.ig:hover{border-bottom-color:var(--accent)}
.p-in .lead{margin-top:16px;color:var(--muted);max-width:60ch;font-size:clamp(1rem,2vw,1.15rem)}
.p-in .chips{margin-top:20px;padding-top:0}
.block{margin-top:clamp(28px,5vw,48px)}
.block>h3{font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.block>h3 small{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--detail)}
.dot.o{background:none;border:2px solid var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:18px;align-items:start}
.tile{margin:0;min-width:0;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms)}
.art{position:relative;aspect-ratio:var(--r,16/9);border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#8F1AA8,#3F004C);border:1px solid var(--line);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .2s}
.tile:hover .art{transform:scale(1.02);border-color:var(--detail)}
.art video,.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{display:grid;justify-items:center;gap:10px;text-align:center;padding:12px;color:var(--muted);font-size:.8rem}
.art a.open{position:absolute;inset:0;align-content:center;color:var(--ink);text-decoration:none;font-weight:600}
.art a.open:hover .play{transform:scale(1.08)}
.play{transition:transform .25s;width:56px;height:56px;border-radius:50%;background:var(--detail);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(43,0,52,.35)}
.play svg{margin-left:3px}
.frame{width:44px;height:44px;border:2px dashed var(--muted);border-radius:8px;display:grid;place-items:center}
.cap{display:flex;align-items:center;gap:10px;margin-top:10px}
.cap b{font-weight:600;font-size:.95rem;line-height:1.3}
.tag{flex:none;font-size:.66rem;letter-spacing:.1em;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.v{background:var(--detail);border-color:var(--detail);color:var(--ink)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.sub{text-align:left;display:flex;gap:14px;align-items:center;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .2s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.sub:hover{transform:translateY(-4px);border-color:var(--detail)}
.sub .m{flex:none;width:64px;height:64px;border-radius:12px;background:linear-gradient(var(--a,135deg),#A524BF,#4A0058);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.sub h4{margin:0;font-family:var(--f-display);font-size:1.1rem;line-height:1.15}
.sub p{color:var(--muted);font-size:.85rem;margin-top:2px}



/* carrossel */
.onlyme{opacity:.75;font-style:italic;font-size:.72rem}
body.pf-preview .tile.empty{display:none}
.carcover{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.carcover img{width:100%;height:100%;object-fit:cover;display:block}
.carbadge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(20,0,26,.78);color:var(--ink);border-radius:99px;padding:4px 10px;font-size:.75rem;font-weight:600}
.lb{position:fixed;inset:0;z-index:70;background:rgba(8,0,12,.92);display:grid;place-items:center;touch-action:pan-y}
.lb[hidden]{display:none}
.lb-stage{position:relative;width:min(92vw,calc((100dvh - 150px) * var(--lr,1)));max-width:960px;aspect-ratio:var(--lr,1);border-radius:14px;overflow:hidden;background:#000;user-select:none}
.lb-track{display:flex;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.lb-track img{flex:none;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,243,252,.9);color:#2b0034;font-size:1.6rem;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:2;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.lb-btn:hover{background:var(--accent)}
.lb-btn[hidden]{display:none}
.lb-prev{left:10px}.lb-next{right:10px}
.lb-close{position:absolute;top:14px;right:14px;z-index:3;border:1px solid var(--line);background:rgba(255,243,252,.1);border-radius:99px;padding:8px 16px;font-weight:600;color:var(--ink);cursor:pointer}
.lb-close:hover{background:var(--accent);color:var(--accent-ink)}
.lb-count{position:absolute;top:12px;left:12px;background:rgba(20,0,26,.7);color:var(--ink);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:99px;z-index:2}
.lb-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:2}
.lb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,243,252,.4)}
.lb-dots i.on{background:#fff;transform:scale(1.2)}
.lb-title{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:var(--muted);font-size:.9rem;padding-inline:16px}

/* rodapé */
.rodape{background:radial-gradient(120% 90% at 20% 0%,rgba(43,0,52,.45),transparent 60%),linear-gradient(135deg,#A524BF,#4A0058);border-top:1px solid var(--line);padding:28px var(--gutter);flex:none}
.contatos{list-style:none;margin:0 auto;padding:0;max-width:1200px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px 32px}
.contatos li,.contatos a{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.contatos a:hover span{text-decoration:underline;text-underline-offset:3px}
.contatos svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:760px){.contatos{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}}
@media (max-width:460px){.contatos{grid-template-columns:1fr}}
@media (min-width:760px){.tile.wide{grid-column:span 2}}
@media (max-width:520px){.tl-head span:last-child{display:none}.lane i{font-size:.66rem;padding:0 5px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<main class="wrap" id="main">
  <section class="hero">
    <h1 id="hero-t">Ideias em <span class="mov">movimento</span><span class="ponto">.</span></h1>
    <div class="linha">
      <img class="assinatura" src="assinatura.png" alt="Assinatura de Camily Schütz">
    </div>
  </section>

  <section aria-labelledby="clientes-t">
    <div class="sec-head"><h2 id="clientes-t">Clientes e projetos</h2></div>
    <ul class="grid" id="grid"></ul>
  </section>
</main>

<footer class="rodape" id="foot"></footer>

<div class="overlay" id="overlay" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title">
    <div class="p-top">
      <nav class="crumbs" id="crumbs" aria-label="Você está em"></nav>
      <button class="close" id="close" type="button">Fechar ✕</button>
    </div>
    <div class="p-scroll" id="pscroll"><div class="p-in" id="pbody"></div><footer class="rodape" id="foot2"></footer></div>
  </div>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Carrossel de imagens">
  <button class="lb-close" id="lb-close" type="button">Fechar ✕</button>
  <div class="lb-stage" id="lb-stage">
    <span class="lb-count" id="lb-count"></span>
    <div class="lb-track" id="lb-track"></div>
    <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Anterior">‹</button>
    <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Próxima">›</button>
    <div class="lb-dots" id="lb-dots"></div>
  </div>
</div>

<script>
/* ===== CONTEÚDO =====
   Vem do servidor (/api/content). Se o servidor estiver fora do ar, usa seed.json. */
let CLIENTS = [], REV = 0, ORDER = [], SETTINGS = { bg:'', heroA:'Ideias em', heroB:'movimento', heroC:'.', tabTitle:'Portfólio de Design e Vídeo' };

/* ===== AUXILIARES ===== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const real = w => !!(w.src || w.canva || (w.images && w.images.length));
const vis = ws => (window.PF_ADMIN ? ws : ws.filter(real));
const worksOf = c => [...vis(c.works||[]), ...(c.children||[]).flatMap(k => vis(k.works||[]))];
const nVid = c => worksOf(c).filter(w => w.t==='video').length;
const nDes = c => worksOf(c).filter(w => w.t!=='video').length;
const plural = (n,s,p) => n + ' ' + (n===1 ? s : p);

/* vídeos sempre primeiro: ordem estável por quantidade de vídeos */
function computeOrder(){ ORDER = CLIENTS.slice(); }

function chipsHTML(c){
  const v = nVid(c), d = nDes(c), k = (c.children||[]).length;
  return (v ? `<span class="chip v">▶ ${plural(v,'vídeo','vídeos')}</span>` : '')
       + (d ? `<span class="chip">${plural(d,'design','designs')}</span>` : '')
       + (k ? `<span class="chip">${plural(k,'projeto','projetos')}</span>` : '');
}

/* ===== RODAPÉ ===== */
const ICONS = {
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>',
  whatsapp:'<path d="M3 21l1.6-4.9A8.5 8.5 0 1 1 8 19.4L3 21z"/><path d="M9.2 8.6c.2 2.4 3.2 5.4 6 6l1.3-1.3-2-1.2-1 .8c-.9-.4-1.9-1.4-2.3-2.3l.8-1-1.2-2-1.6.9z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
let FOOTER = [];
function applySettings(){
  const st = SETTINGS;
  $('#hero-t').innerHTML = `${esc(st.heroA||'')} <span class="mov">${esc(st.heroB||'')}</span><span class="ponto">${esc(st.heroC||'')}</span>`;
  document.title = st.tabTitle || 'Portfólio';
  const img = st.bg || 'fundo.jpg';
  document.documentElement.style.setProperty('--foto', `linear-gradient(rgba(43,0,52,.80),rgba(43,0,52,.80)),url(${img}) center 25%/cover no-repeat`);
}
function footerHTML(){
  const items = FOOTER.map(i => {
    const svg = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[i.icon] || ICONS.link}</svg>`;
    const inner = `${svg}<span>${esc(i.text || '')}</span>`;
    if(!i.href) return `<li>${inner}</li>`;
    const ext = /^https?:/.test(i.href) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return `<li><a href="${esc(i.href)}"${ext}>${inner}</a></li>`;
  }).join('');
  return `<ul class="contatos">${items}</ul>${AD()?AD().footer():''}`;
}
function renderFooter(){ const h = footerHTML(); $('#foot').innerHTML = h; $('#foot2').innerHTML = h; }

/* ===== GRADE ===== */
const grid = $('#grid');
const AD = () => window.PF_ADMIN || null;
function renderGrid(){
  grid.innerHTML = ORDER.map((c,i) => `
  <li style="--i:${i}" data-cid="${c.id}">
    <button class="card" type="button" data-id="${c.id}" aria-label="Abrir ${esc(c.name||'projeto')}">
      <div class="thumb" style="--a:${120+i*37}deg;--x:${(i*23)%80+10}%${c.cover?`;background:url(${c.cover}) center/cover no-repeat`:''}">
      </div>
      <div class="cbody">
        ${c.name?`<h3>${esc(c.name)}</h3>`:''}
        ${c.kind?`<p class="kind">${esc(c.kind)}</p>`:''}
        <div class="chips">${chipsHTML(c)}</div>
      </div>
    </button>${AD()?AD().card(c):''}
  </li>`).join('') + (AD()?AD().newCard():'');
}

/* ===== PAINEL ===== */
const overlay = $('#overlay'), pbody = $('#pbody'), pscroll = $('#pscroll'), crumbs = $('#crumbs'), closeBtn = $('#close');
let currentKey = null, currentClient = null, closing = false;

function lookup(id){
  for(const c of CLIENTS){
    if(c.id===id) return {c, k:null};
    const k = (c.children||[]).find(x => x.id===id);
    if(k) return {c, k};
  }
  return null;
}

function tileHTML(w, i){
  const video = w.t==='video';
  const wide = video && w.r==='16/9' ? ' wide' : '';
  let art;
  if(w.t==='carousel'){
    const im = w.images||[];
    art = im.length ? `<button type="button" class="carcover" data-car="${curItem.works.indexOf(w)}" aria-label="Abrir carrossel"><img src="${esc(im[0])}" alt="${esc(w.title||'Carrossel')}" loading="lazy"><span class="carbadge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="14" height="14" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>${im.length}</span></button>` : `<div class="ph"><span>Carrossel vazio</span></div>`;
  } else if(w.canva){
    art = `<a class="ph open" href="${esc(w.canva)}" target="_blank" rel="noopener noreferrer"><span class="play"><svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M2 2l16 9-16 9z" fill="#FFF3FC"/></svg></span><span>Abrir apresentação no Canva ↗</span></a>`;
  } else if(w.src){
    art = video ? `<video src="${esc(w.src)}#t=0.1" controls playsinline preload="metadata"></video>`
                : `<img src="${esc(w.src)}" alt="${esc(w.title)}" loading="lazy">`;
  } else if(video){
    art = `<div class="ph"><span class="play"><svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M2 2l16 9-16 9z" fill="#FFF3FC"/></svg></span><span>Seu vídeo aqui</span>${AD()?'<small class="onlyme">visível só para você</small>':''}</div>`;
  } else {
    art = `<div class="ph"><span class="frame"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#E8C3F2" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="2"/><path d="M3 17l5-5 4 4 3-3 4 4"/></svg></span><span>Seu trabalho aqui</span>${AD()?'<small class="onlyme">visível só para você</small>':''}</div>`;
  }
  return `<figure class="tile${wide}${real(w)?'':' empty'}" data-wi="${curItem.works.indexOf(w)}" style="--i:${i};--r:${w.r||'16/9'}">
    <div class="art">${art}${AD()?AD().tile(curItem, curItem.works.indexOf(w)):''}</div>
    ${w.title?`<figcaption class="cap">${video?'':'<span class="tag">DESIGN</span>'}<b>${esc(w.title)}</b></figcaption>`:''}
  </figure>`;
}

function section(title, list, isVideo){
  if(!list.length) return '';
  return `<section class="block"><h3><span class="dot${isVideo?'':' o'}"></span>${title}<small>${plural(list.length,'trabalho','trabalhos')}</small></h3>
    <div class="tiles">${list.map(tileHTML).join('')}</div></section>`;
}

let curItem = null;
function render(c, k){
  const item = k || c;
  curItem = item;
  const works = vis(item.works || []);
  const vids = works.filter(w => w.t==='video');
  const others = works.filter(w => w.t!=='video');
  crumbs.innerHTML = `<button type="button" data-go="">Portfólio</button><span aria-hidden="true">›</span>` +
    (k ? `<button type="button" data-go="${c.id}">${esc(c.name||'Projeto')}</button><span aria-hidden="true">›</span><span aria-current="page">${esc(k.name||'Projeto')}</span>`
       : `<span aria-current="page">${esc(c.name||'Projeto')}</span>`);
  const subs = (!k && c.children) ? `<section class="block"><h3><span class="dot o"></span>Projetos<small>${plural(c.children.length,'projeto','projetos')}</small></h3>
    <div class="subs">${c.children.map((s,i)=>`
      <button class="sub" type="button" data-go="${s.id}" style="--i:${i};--a:${120+i*50}deg">
        <span><h4>${esc(s.name||'Projeto')}</h4>${s.kind?`<p>${esc(s.kind)}</p>`:''}</span>
      </button>`).join('')}</div></section>` : '';
  const ig = item.ig ? `<a class="ig" href="https://www.instagram.com/${esc(item.ig)}/" target="_blank" rel="noopener noreferrer">@${esc(item.ig)}</a>` : '';
  pbody.innerHTML = `<h2 id="p-title"${item.name?'':' hidden'}>${esc(item.name)}</h2>
    ${ig}
    ${item.desc?`<p class="lead">${esc(item.desc)}</p>`:''}
    <div class="chips">${chipsHTML(item)}</div>
    ${AD()?AD().head(item, !!k):''}
    ${subs}
    ${section('Vídeos', vids, true)}
    ${section(vids.length ? 'Design e materiais' : 'Trabalhos', others, false)}`;
}

function originClip(c){
  const el = grid.querySelector(`[data-id="${c.id}"]`);
  if(!el) return null;
  const r = el.getBoundingClientRect();
  return `inset(${Math.max(r.top,0)}px ${Math.max(innerWidth-r.right,0)}px ${Math.max(innerHeight-r.bottom,0)}px ${Math.max(r.left,0)}px round 20px)`;
}
const FULL = 'inset(0px 0px 0px 0px round 0px)';

function lockUI(on){
  ['topbar','main','foot'].forEach(id => { const e = document.getElementById(id); if(e) e.inert = on; });
  document.documentElement.style.overflow = on ? 'hidden' : '';
}

function openPanel(c, k){
  const first = overlay.hidden;
  currentClient = c;
  render(c, k);
  pscroll.scrollTop = 0;
  if(first){
    overlay.hidden = false;
    lockUI(true);
    const from = originClip(c);
    if(!RM && from) overlay.animate([{clipPath:from},{clipPath:FULL}], {duration:560, easing:'cubic-bezier(.2,.8,.2,1)'});
    else if(!RM) overlay.animate([{opacity:0},{opacity:1}], {duration:250});
    closeBtn.focus({preventScroll:true});
  } else if(!RM){
    pbody.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}], {duration:380, easing:'cubic-bezier(.2,.8,.2,1)'});
  }
}

function closePanel(){
  if(overlay.hidden || closing) return;
  closing = true;
  const c = currentClient;
  const done = () => {
    overlay.hidden = true; closing = false; lockUI(false);
    const btn = c && grid.querySelector(`[data-id="${c.id}"]`);
    if(btn) btn.focus({preventScroll:true});
  };
  const to = c && originClip(c);
  if(RM) return done();
  const a = overlay.animate([{clipPath:FULL},{clipPath: to || 'inset(50% 50% 50% 50% round 20px)'}], {duration:440, easing:'cubic-bezier(.5,0,.2,1)', fill:'forwards'});
  a.finished.then(() => { done(); a.cancel(); }).catch(done);
}

function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const hit = id && lookup(id);
  if(!hit){ currentKey = null; closePanel(); return; }
  if(currentKey === id && !overlay.hidden) return;
  currentKey = id;
  openPanel(hit.c, hit.k);
}
function go(id){
  if(location.hash.slice(1) !== id){ try{ location.hash = id; }catch(e){} }
  route();
}

grid.addEventListener('click', e => {
  const b = e.target.closest('.card'); if(b) go(b.dataset.id);
});
pbody.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if(b) go(b.dataset.go);
});
crumbs.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if(b) go(b.dataset.go);
});
closeBtn.addEventListener('click', () => go(''));
document.addEventListener('keydown', e => {
  if(e.key!=='Escape' || overlay.hidden) return;
  const hit = lookup(currentKey || '');
  go(hit && hit.k ? hit.c.id : '');
});
addEventListener('hashchange', route);

/* ===== CARROSSEL (janela com setinhas, estilo Instagram) ===== */
const lb = $('#lb'), lbTrack = $('#lb-track'), lbStage = $('#lb-stage');
let lbImgs = [], lbI = 0, lbOpener = null;
function lbShow(i){
  lbI = Math.max(0, Math.min(lbImgs.length-1, i));
  lbTrack.style.transform = `translateX(${-100*lbI}%)`;
  $('#lb-count').textContent = `${lbI+1}/${lbImgs.length}`;
  $('#lb-prev').hidden = lbI===0; $('#lb-next').hidden = lbI===lbImgs.length-1;
  $('#lb-dots').innerHTML = lbImgs.length>1 ? lbImgs.map((_,k)=>`<i class="${k===lbI?'on':''}"></i>`).join('') : '';
  $('#lb-count').hidden = lbImgs.length<2;
}
function openCarousel(w, start){
  lbImgs = w.images || []; if(!lbImgs.length) return;
  const [a,b] = (w.r||'1/1').split('/').map(Number);
  lbStage.style.setProperty('--lr', (a/b) || 1);
  lbTrack.innerHTML = lbImgs.map((u,k)=>`<img src="${esc(u)}" alt="${esc(w.title||'Imagem')} ${k+1}" ${Math.abs(k-start)<2?'':'loading="lazy"'}>`).join('');
  lbOpener = document.activeElement; lb.hidden = false;
  lbTrack.style.transition = 'none'; lbShow(start); void lbTrack.offsetWidth; lbTrack.style.transition = '';
  $('#lb-close').focus({preventScroll:true});
}
function closeCarousel(){ lb.hidden = true; lbTrack.innerHTML = ''; if(lbOpener && lbOpener.focus) lbOpener.focus({preventScroll:true}); }
$('#lb-prev').addEventListener('click', () => lbShow(lbI-1));
$('#lb-next').addEventListener('click', () => lbShow(lbI+1));
$('#lb-close').addEventListener('click', closeCarousel);
lb.addEventListener('click', e => { if(e.target===lb) closeCarousel(); });
addEventListener('keydown', e => {
  if(lb.hidden) return;
  if(e.key==='Escape'){ e.stopImmediatePropagation(); closeCarousel(); }
  else if(e.key==='ArrowLeft'){ e.stopImmediatePropagation(); lbShow(lbI-1); }
  else if(e.key==='ArrowRight'){ e.stopImmediatePropagation(); lbShow(lbI+1); }
}, true);
let swX = null;
lbStage.addEventListener('pointerdown', e => { if(!e.target.closest('.lb-btn')) swX = e.clientX; });
addEventListener('pointerup', e => {
  if(swX===null) return; const dx = e.clientX - swX; swX = null;
  if(Math.abs(dx) > 45) lbShow(lbI + (dx < 0 ? 1 : -1));
});
pbody.addEventListener('click', e => {
  const c = e.target.closest('[data-car]'); if(!c || !curItem) return;
  openCarousel(curItem.works[Number(c.dataset.car)], 0);
});

/* API para o painel de administração (só é carregado para quem está logada) */
window.PF = {
  openCarousel,
  get clients(){ return CLIENTS; }, get rev(){ return REV; }, set rev(v){ REV = v; },
  setClients(list, rev, footer, settings){ CLIENTS = list; if(rev!=null) REV = rev; if(footer) FOOTER = footer; if(settings) SETTINGS = settings; this.refresh(); },
  get settings(){ return SETTINGS; }, set settings(v){ SETTINGS = v; },
  get footer(){ return FOOTER; }, set footer(v){ FOOTER = v; },
  get key(){ return currentKey; }, lookup, go, esc,
  refresh(){
    computeOrder(); renderGrid(); renderFooter(); applySettings();
    if(!overlay.hidden){
      const hit = lookup(currentKey || '');
      if(hit){ currentClient = hit.c; render(hit.c, hit.k); } else go('');
    }
  }
};

(async function boot(){
  let data = null;
  try{ const r = await fetch('/api/content'); if(r.ok) data = await r.json(); }catch(e){}
  if(!data){ try{ const sd = await (await fetch('seed.json')).json(); data = { clients: sd.clients, footer: sd.footer, settings: sd.settings, rev: 0 }; }catch(e){ data = { clients: [], footer: [], rev: 0 }; } }
  CLIENTS = data.clients; REV = data.rev; FOOTER = data.footer || []; if(data.settings) SETTINGS = data.settings;
  computeOrder(); renderGrid(); renderFooter(); applySettings(); route();
  try{
    const me = await (await fetch('/api/me')).json();
    if(me.admin){ const sc = document.createElement('script'); sc.src = '/api/admin-ui.js'; document.head.append(sc); }
  }catch(e){}
})();
</script>
